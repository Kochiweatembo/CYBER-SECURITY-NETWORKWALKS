<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" width="780" height="380" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="780" height="380" fill="#ffffff"/>

  <!-- Host -->
  <rect x="20" y="20" width="560" height="340" rx="12" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="36" y="46" font-size="14" font-weight="bold" fill="#111827">Host machine (Windows) running VirtualBox</text>

  <!-- NAT Network -->
  <rect x="40" y="70" width="520" height="270" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="56" y="96" font-size="14" font-weight="bold" fill="#1e3a8a">NAT Network: NatNetwork, 10.0.0.0/24 (DHCP enabled)</text>

  <!-- Kali VM -->
  <rect x="60" y="130" width="190" height="90" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="155" y="165" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">Kali Linux VM</text>
  <text x="155" y="190" font-size="13" fill="#14532d" text-anchor="middle">10.0.0.2/24 (static)</text>

  <!-- Future VMs -->
  <rect x="60" y="250" width="190" height="70" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="155" y="280" font-size="14" fill="#374151" text-anchor="middle">Future target VMs</text>
  <text x="155" y="300" font-size="12" fill="#6b7280" text-anchor="middle">(authorized testing only)</text>

  <!-- Gateway -->
  <rect x="340" y="170" width="170" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="425" y="200" font-size="14" font-weight="bold" fill="#78350f" text-anchor="middle">NAT gateway</text>
  <text x="425" y="222" font-size="13" fill="#78350f" text-anchor="middle">10.0.0.1</text>

  <!-- Internet -->
  <ellipse cx="685" cy="205" rx="80" ry="58" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
  <text x="685" y="200" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">Internet</text>
  <text x="685" y="222" font-size="13" fill="#374151" text-anchor="middle">DNS 8.8.8.8</text>

  <!-- Arrows -->
  <line x1="250" y1="178" x2="338" y2="200" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="250" y1="285" x2="338" y2="232" stroke="#374151" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <line x1="510" y1="205" x2="603" y2="205" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
